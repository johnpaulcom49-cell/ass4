<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskForge | Task Management Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="./output.css" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            display: ['Sora', '"DM Sans"', 'sans-serif']
          }
        }
      }
    };
  </script>
   <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  

    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-3 px-4 py-3">
      <div class="flex items-center gap-2">
        <svg class="h-7 w-7 text-orange-700 dark:text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8h13a4 4 0 0 1-4 4H8l-1 3h10v3H5v-3l1-3a5 5 0 0 1-3-4z"></path>
        </svg>
        <h1 class="font-display text-xl font-bold">TaskForge</h1>
      </div>
 
      <div class="order-last w-full sm:order-none sm:w-auto sm:flex-1">
        <label for="search-input" class="sr-only">Search tasks</label>
        <input id="search-input" type="search" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" placeholder="Search by title, description or category   ( press / )" autocomplete="off">
      </div>
 
      <div class="ml-auto flex items-center gap-2 sm:ml-0">
        <button id="theme-toggle" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" aria-pressed="false">Dark mode</button>
        <button id="add-task-btn" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm bg-orange-700 text-white enabled:hover:bg-orange-800">Add Task</button>
      </div>
    </div>
  </header>
 
  <main class="mx-auto max-w-6xl px-4 py-6">
 
    <section aria-label="Task statistics" class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      <div class="stat-card rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900" data-stat="total">
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Total Tasks</p>
        <p class="stat-number mt-1 font-display text-3xl font-bold">0</p>
      </div>
      <div class="stat-card rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900" data-stat="completed">
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Completed Tasks</p>
        <p class="stat-number mt-1 font-display text-3xl font-bold text-emerald-600 dark:text-emerald-400">0</p>
      </div>
      <div class="stat-card rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900" data-stat="pending">
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Pending Tasks</p>
        <p class="stat-number mt-1 font-display text-3xl font-bold text-blue-600 dark:text-blue-400">0</p>
      </div>
      <div class="stat-card rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900" data-stat="overdue">
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Overdue Tasks</p>
        <p class="stat-number mt-1 font-display text-3xl font-bold text-red-600 dark:text-red-400">0</p>
      </div>
    </section>
 
    <section aria-label="Filters and sorting" class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900 mt-6">
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <div>
          <label for="filter-status" class="mb-1 block text-sm font-medium">Status</label>
          <select id="filter-status" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" data-filter="status">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="overdue">Overdue</option>
          </select>
        </div>
        <div>
          <label for="filter-priority" class="mb-1 block text-sm font-medium">Priority</label>
          <select id="filter-priority" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" data-filter="priority">
            <option value="all">All</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div>
          <label for="filter-category" class="mb-1 block text-sm font-medium">Category</label>
          <select id="filter-category" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" data-filter="category">
            <option value="all">All</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="School">School</option>
            <option value="Backend">Backend</option>
            <option value="Frontend">Frontend</option>
            <option value="Fintech">Fintech</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label for="sort-select" class="mb-1 block text-sm font-medium">Sort by</label>
          <select id="sort-select" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" data-filter="sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="priority-high">Highest Priority</option>
            <option value="priority-low">Lowest Priority</option>
            <option value="due-soon">Closest Due Date</option>
            <option value="due-late">Furthest Due Date</option>
            <option value="custom">My custom order</option>
          </select>
        </div>
      </div>
 
      <div class="mt-4 flex flex-wrap gap-2">
        <button id="clear-filters" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-2.5 py-1 text-xs border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800">Clear filters</button>
        <button id="export-btn" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-2.5 py-1 text-xs border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800">Export JSON</button>
        <button id="import-btn" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-2.5 py-1 text-xs border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800">Import JSON</button>
        <input id="import-input" type="file" accept="application/json,.json" class="hidden">
      </div>
    </section>
 
    <section id="bulk-bar" aria-label="Bulk actions" class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900 mt-4 flex flex-wrap items-center gap-3">
      <label class="flex items-center gap-2 text-sm font-medium">
        <input id="select-all" type="checkbox" class="h-4 w-4 accent-orange-700">
        Select all
      </label>
      <span id="selected-count" class="text-sm text-slate-500 dark:text-slate-400" aria-live="polite">0 selected</span>
      <div class="ml-auto flex flex-wrap gap-2">
        <button id="bulk-complete" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-2.5 py-1 text-xs border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" disabled>Mark completed</button>
        <button id="bulk-pending" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-2.5 py-1 text-xs border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" disabled>Mark pending</button>
        <button id="bulk-delete" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-2.5 py-1 text-xs bg-red-600 text-white enabled:hover:bg-red-700" disabled>Delete selected</button>
      </div>
    </section>
 
    <section id="task-list" class="mt-4 space-y-3" aria-label="Task list" aria-live="polite"></section>
    <div id="empty-state" class="hidden"></div>
    <nav id="pagination" class="mt-6 hidden flex-wrap items-center justify-center gap-2" aria-label="Pagination"></nav>
 
    <p class="mt-10 text-center text-xs text-slate-500 dark:text-slate-400">
      Shortcuts: N new task, / search, Esc close, Ctrl + Enter save task
    </p>
  </main>
 
  <div id="form-modal" class="modal fixed inset-0 z-40 hidden items-center justify-center overflow-y-auto bg-slate-900/60 p-4" aria-hidden="true">
    <div class="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl dark:bg-slate-900" role="dialog" aria-modal="true" aria-labelledby="form-heading">
      <h2 id="form-heading" class="font-display text-xl font-bold">Add task</h2>
 
      <form id="task-form" class="mt-4 space-y-4" novalidate>
        <div>
          <label for="task-title" class="mb-1 block text-sm font-medium">Title</label>
          <input id="task-title" name="title" type="text" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" placeholder="What needs to be done?">
          <p class="mt-1 text-xs text-red-600 dark:text-red-400 hidden" data-error-for="title"></p>
        </div>
 
        <div>
          <label for="task-description" class="mb-1 block text-sm font-medium">Description</label>
          <textarea id="task-description" name="description" rows="3" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" placeholder="Add a few details (at least 10 characters)"></textarea>
          <p class="mt-1 text-xs text-red-600 dark:text-red-400 hidden" data-error-for="description"></p>
        </div>
 
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="task-category" class="mb-1 block text-sm font-medium">Category</label>
            <select id="task-category" name="category" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
              <option value="">Select category</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="School">School</option>
              <option value="Backend">Backend</option>
              <option value="Frontend">Frontend</option>
              <option value="Fintech">Fintech</option>
              <option value="Other">Other</option>
            </select>
            <p class="mt-1 text-xs text-red-600 dark:text-red-400 hidden" data-error-for="category"></p>
          </div>
          <div>
            <label for="task-priority" class="mb-1 block text-sm font-medium">Priority</label>
            <select id="task-priority" name="priority" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
              <option value="">Select priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
            <p class="mt-1 text-xs text-red-600 dark:text-red-400 hidden" data-error-for="priority"></p>
          </div>
        </div>
 
        <div>
          <label for="task-due" class="mb-1 block text-sm font-medium">Due date</label>
          <input id="task-due" name="dueDate" type="date" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-orange-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
          <p class="mt-1 text-xs text-red-600 dark:text-red-400 hidden" data-error-for="dueDate"></p>
        </div>
 
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" data-close="form-modal">Cancel</button>
          <button id="form-submit" type="submit" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm bg-orange-700 text-white enabled:hover:bg-orange-800">Add task</button>
        </div>
      </form>
    </div>
  </div>
 
  <div id="details-modal" class="modal fixed inset-0 z-40 hidden items-center justify-center overflow-y-auto bg-slate-900/60 p-4" aria-hidden="true">
    <div class="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl dark:bg-slate-900" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <h2 id="detail-title" class="break-words font-display text-xl font-bold"></h2>
      <p id="detail-description" class="mt-3 whitespace-pre-line break-words text-slate-600 dark:text-slate-300"></p>
 
      <dl class="mt-5 grid grid-cols-2 gap-4 text-sm">
        <div>
          <dt class="text-xs font-semibold text-slate-500 dark:text-slate-400">Category</dt>
          <dd id="detail-category" class="mt-1 font-medium"></dd>
        </div>
        <div>
          <dt class="text-xs font-semibold text-slate-500 dark:text-slate-400">Priority</dt>
          <dd class="mt-1"><span id="detail-priority" class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold"></span></dd>
        </div>
        <div>
          <dt class="text-xs font-semibold text-slate-500 dark:text-slate-400">Status</dt>
          <dd class="mt-1"><span id="detail-status" class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold"></span></dd>
        </div>
        <div>
          <dt class="text-xs font-semibold text-slate-500 dark:text-slate-400">Due date</dt>
          <dd id="detail-due" class="mt-1 font-medium"></dd>
        </div>
        <div class="col-span-2">
          <dt class="text-xs font-semibold text-slate-500 dark:text-slate-400">Created</dt>
          <dd id="detail-created" class="mt-1 font-medium"></dd>
        </div>
      </dl>
 
      <div class="mt-6 flex flex-wrap justify-end gap-2">
        <button type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" data-close="details-modal">Close</button>
        <button type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" data-action="edit-from-details">Edit</button>
        <button type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm bg-red-600 text-white enabled:hover:bg-red-700" data-action="delete-from-details">Delete</button>
      </div>
    </div>
  </div>
 
  <div id="confirm-modal" class="modal fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/60 p-4" aria-hidden="true">
    <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl dark:bg-slate-900" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <h2 id="confirm-title" class="font-display text-lg font-bold"></h2>
      <p id="confirm-message" class="mt-2 break-words text-sm text-slate-600 dark:text-slate-300"></p>
      <div class="mt-6 flex justify-end gap-2">
        <button id="confirm-cancel" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm border-slate-300 bg-white text-slate-700 enabled:hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:enabled:hover:bg-slate-800" data-close="confirm-modal">Cancel</button>
        <button id="confirm-ok" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-transparent font-semibold leading-tight transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 disabled:cursor-not-allowed disabled:opacity-45 px-4 py-2 text-sm bg-red-600 text-white enabled:hover:bg-red-700">Confirm</button>
      </div>
    </div>
  </div>
 
  <div id="toast-container" class="fixed bottom-4 right-4 z-[70] flex max-w-[calc(100%-2rem)] flex-col gap-2" aria-live="polite"></div>
 
  <template id="task-template">
    <article class="task-card rounded-xl border border-l-[5px] p-4 transition-opacity" draggable="true" data-id="">
      <div class="flex items-start gap-3">
        <input type="checkbox" class="task-checkbox mt-1 h-4 w-4 shrink-0 accent-orange-700" aria-label="Select task">
        <div class="task-body min-w-0 flex-1 cursor-pointer" data-action="details" tabindex="0">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="task-title break-words font-semibold"></h3>
            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold task-status"></span>
            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold task-priority"></span>
            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold border border-slate-300 text-slate-600 dark:border-slate-600 dark:text-slate-300 task-category"></span>
          </div>
          <p class="task-description mt-1 line-clamp-2 break-words text-sm text-slate-600 dark:text-slate-300"></p>
          <p class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 dark:text-slate-400">
            <span>Due: <time class="task-due"></time></span>
            <span>Created: <time class="task-created"></time></span>
          </p>
        </div>
        <div class="task-actions flex shrink-0 flex-col gap-2 sm:flex-row">
